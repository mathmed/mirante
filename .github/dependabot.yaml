# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 100
    # Dependency bumps are born low (.claude/agents/pr-writer.md, step 5); a reviewer raises the label
    # when a bump changes behavior. Dependabot ignores labels that do not exist: `make risk-labels`
    # creates them.
    labels:
      - "dependencies"
      - "risk:low"
    # Supply-chain safety: give the community time to detect malicious or broken releases.
    cooldown:
      default-days: 10
      semver-major-days: 15
      semver-minor-days: 10
      semver-patch-days: 5
    groups:
      npm-non-breaking:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"
    ignore:
      # Follows the Node.js major the tooling runs on (devEngines in package.json): bump both on purpose.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # npm aliases running TypeScript 7 (tsc) side by side with the TypeScript 6 API that
      # typescript-eslint, Stryker and dependency-cruiser still need. Dependabot reads alias keys as
      # package names, so these two are updated by hand until the tools support TypeScript 7.
      - dependency-name: "typescript"
      - dependency-name: "@typescript/native"
      # Pinned to the version of the owner's Immich server (3.3.6): the SDK is generated from the
      # server's API, so it is bumped by hand together with the server.
      - dependency-name: "@immich/sdk"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 50
    # Action bumps are born low, like the npm ones
    labels:
      - "dependencies"
      - "risk:low"
    # Supply-chain safety: give the community time to detect malicious or broken releases.
    cooldown:
      default-days: 10
    groups:
      actions-non-breaking:
        update-types:
          - "minor"
          - "patch"
      actions-major:
        update-types:
          - "major"
